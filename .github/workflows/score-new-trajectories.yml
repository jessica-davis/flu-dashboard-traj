name: Update dashboard

on:
  push:
    branches: [main]
    paths:
      - "raw/multistrain_retrospective_trajectories/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas pyarrow requests matplotlib geopandas certifi

      - name: Update surveillance data
        run: |
          python -c "
          import pandas as pd
          url = 'https://raw.githubusercontent.com/cdcepi/FluSight-forecast-hub/main/target-data/target-hospital-admissions.csv'
          obs = pd.read_csv(url, dtype={'location': str})
          obs.to_parquet('data/processed/target_data.parquet', index=False)
          print(f'Updated target_data.parquet: {len(obs)} rows, {obs.date.min()} to {obs.date.max()}')
          "

      - name: Convert raw trajectories to processed format
        run: python scripts/csv_to_parquet.py

      - name: Build dashboard JSONs
        run: python scripts/preprocess.py

      - name: Compute evaluation scores
        run: python scripts/compute_all_scores.py

      - name: Convert scores to dashboard JSON
        run: python scripts/convert_scores.py

      - name: Convert baseline quantile forecasts
        run: python scripts/convert_baseline_quantiles.py

      - name: Regenerate figures
        run: |
          python scripts/plot_wis_map_and_horizons.py
          python scripts/plot_wis_timeseries.py
          python scripts/plot_evaluation_overview.py

      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/target_data.parquet data/processed/trajectories data/scores docs/data figures/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: update dashboard after new trajectory data"
            git push
          fi
